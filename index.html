<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Administración de credenciales</title>
</head>
<body>
<!-- Formularios de administración de las credenciales de acceso. -->
<h2>Alta de Usuario</h2>
<form action="alta.php" method="POST">
  Usuario: <input type="text" name="usuario" required><br>
  Contraseña: <input type="password" name="contrasena" required><br>
  <input type="submit" value="Agregar">
</form>

<hr>

<h2>Baja de Usuario</h2>
<form action="baja.php" method="POST">
  ID de credencial a eliminar: <input type="number" name="id_credencial" min="1" required><br>
  <input type="submit" value="Eliminar">
</form>

<hr>

<h2>Modificación de Contraseña</h2>
<form action="modificar.php" method="POST">
  ID de credencial: <input type="number" name="id_credencial" min="1" required><br>
  Nueva contraseña: <input type="password" name="contrasena" required><br>
  <input type="submit" value="Modificar">
</form>
</body>
</html>
